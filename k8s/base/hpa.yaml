apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bytewax-pipeline-hpa
  namespace: bytewax-pipeline
  labels:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bytewax-pipeline
  
  minReplicas: 2
  maxReplicas: 8  # Should not exceed number of Kafka partitions
  
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics (if available) - Kafka consumer lag
  # - type: External
  #   external:
  #     metric:
  #       name: kafka_consumer_lag_sum
  #       selector:
  #         matchLabels:
  #           consumer_group: "bytewax-pipeline-main"
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"  # Scale up if lag > 1000 messages
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60   # 1 minute
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max