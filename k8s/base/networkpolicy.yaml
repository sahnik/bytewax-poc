apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bytewax-pipeline-egress
  namespace: bytewax-pipeline
  labels:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bytewax-pipeline
  policyTypes:
  - Egress
  - Ingress
  
  # Ingress rules - allow metrics scraping
  ingress:
  - from:
    # Allow Prometheus to scrape metrics
    - namespaceSelector:
        matchLabels:
          name: monitoring
    # Allow same namespace communication
    - namespaceSelector:
        matchLabels:
          name: bytewax-pipeline
    ports:
    - protocol: TCP
      port: 8000
  
  # Egress rules - allow all external traffic for sandbox compatibility
  egress:
  # Allow all external traffic (simplified for sandbox)
  - to: []
  
  # Allow internal cluster communication
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8000