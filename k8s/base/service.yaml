apiVersion: v1
kind: Service
metadata:
  name: bytewax-pipeline-metrics
  namespace: bytewax-pipeline
  labels:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: data-processor

---
apiVersion: v1
kind: Service
metadata:
  name: bytewax-pipeline-headless
  namespace: bytewax-pipeline
  labels:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: discovery
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for pod discovery
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: data-processor