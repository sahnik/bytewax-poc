apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: bytewax-pipeline-base
  annotations:
    description: "Base Kubernetes manifests for Bytewax data pipeline"

# Common labels applied to all resources
labels:
- pairs:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/managed-by: kustomize

# Common annotations applied to all resources
commonAnnotations:
  app.kubernetes.io/version: "1.0.0"

# Resources to include
resources:
- configmap.yaml
- deployment.yaml
- service.yaml
- servicemonitor.yaml
- networkpolicy.yaml
# - hpa.yaml  # Disabled for sandbox - metrics server issues

# Image transformations
images:
- name: bytewax-pipeline
  newTag: latest
- name: bytewax-publisher  
  newTag: latest
- name: bytewax-populator
  newTag: latest

# Namespace for all resources (will be overridden by overlays)
namespace: sahnik-dev

# Patches for common modifications
patches:
# Add resource quotas to deployment
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
      value: 1Gi
    - op: add
      path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
      value: 5Gi
  target:
    kind: Deployment
    name: bytewax-pipeline