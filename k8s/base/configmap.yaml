apiVersion: v1
kind: ConfigMap
metadata:
  name: bytewax-config
  namespace: bytewax-pipeline
  labels:
    app.kubernetes.io/name: bytewax-pipeline
    app.kubernetes.io/component: config
data:
  # Confluent Cloud Kafka Configuration (non-sensitive)
  KAFKA_BOOTSTRAP_SERVERS: "pkc-XXXXX.us-east-1.aws.confluent.cloud:9092"
  KAFKA_SOURCE_TOPIC: "input-topic"
  KAFKA_SINK_TOPIC: "output-topic"
  KAFKA_LOOKUP_TOPIC: "lookup-topic"
  KAFKA_ERROR_TOPIC: "error-topic"
  KAFKA_CONSUMER_GROUP_MAIN: "bytewax-pipeline-main"
  KAFKA_CONSUMER_GROUP_LOOKUP: "bytewax-pipeline-lookup"
  
  # Kafka Consumer Settings
  KAFKA_AUTO_OFFSET_RESET_MAIN: "latest"
  KAFKA_AUTO_OFFSET_RESET_LOOKUP: "earliest"
  KAFKA_AUTO_COMMIT_ENABLED: "true"
  KAFKA_AUTO_COMMIT_INTERVAL_MS: "1000"
  
  # Kafka Performance Tuning
  KAFKA_FETCH_MAX_WAIT_MS: "100"
  KAFKA_FETCH_MIN_BYTES: "1"
  
  # Confluent Cloud Security (non-sensitive)
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "PLAIN"
  
  # Processing Configuration
  PIPELINE_WORKERS: "2"
  RECORDS_PER_SECOND: "100"
  CACHE_TTL_SECONDS: "300"
  
  # Metrics Configuration
  METRICS_PORT: "8000"
  METRICS_ENABLED: "true"
  
  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"