apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: bytewax-pipeline-dev
  annotations:
    description: "Development environment configuration for Bytewax pipeline"

# Include base configuration
resources:
- ../../base
- ../../jobs

# Namespace override for dev
namespace: bytewax-pipeline-dev

# Name prefix for dev resources
namePrefix: dev-

# Common labels for dev environment
commonLabels:
  environment: development
  team: data-engineering

# Images with dev tags
images:
- name: bytewax-pipeline
  newTag: dev-latest
- name: bytewax-publisher
  newTag: dev-latest  
- name: bytewax-populator
  newTag: dev-latest

# Patches for development environment
patches:
# Reduce resource requirements for dev
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 256Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1000m
  target:
    kind: Deployment
    name: bytewax-pipeline

# Reduce HPA settings for dev
- patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 3
  target:
    kind: HorizontalPodAutoscaler
    name: bytewax-pipeline-hpa

# Add dev-specific config for Confluent Cloud
configMapGenerator:
- name: bytewax-config-dev
  literals:
  - LOG_LEVEL=DEBUG
  - RECORDS_PER_SECOND=50
  - CACHE_TTL_SECONDS=120
  - KAFKA_BOOTSTRAP_SERVERS=pkc-XXXXX.us-east-1.aws.confluent.cloud:9092

# Merge the dev config with base config
replacements:
- source:
    kind: ConfigMap
    name: bytewax-config-dev
    fieldPath: data
  targets:
  - select:
      kind: ConfigMap
      name: bytewax-config
    fieldPaths:
    - data